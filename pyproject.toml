[project]
name = "proyecto-neumonia"
version = "0.1.0"
description = "Herramienta de detección de neumonía en imágenes radiográficas"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "pillow>=9.0.0,<11.0.0",
    "pydicom>=2.3.0",
    "opencv-python>=4.5.0",
    "tensorflow==2.15.1",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "pyautogui>=0.9.50",
    "tkcap>=0.0.4",
    "img2pdf>=0.4.0",
    "pytest>=7.0.0",
]

[tool.setuptools]
py-modules = ["detector_neumonia", "grad_cam", "integrator", "load_model", "preprocess_img", "read_img"]
